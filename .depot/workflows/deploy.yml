name: deploy get

# Deploys the unified get release service.
#
# Migrations run before the deploy: the Worker reads the product and channel
# tables on its first request. Depot does not export secrets into the
# environment on its own, so every secret is mapped below.

on:
  push:
    branches:
      - master
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-get
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GET_DATABASE_URL: ${{ secrets.GET_DATABASE_URL }}
      GET_AWS_ACCESS_KEY_ID: ${{ secrets.GET_AWS_ACCESS_KEY_ID }}
      GET_AWS_SECRET_ACCESS_KEY: ${{ secrets.GET_AWS_SECRET_ACCESS_KEY }}
      GET_AWS_REGION: ${{ secrets.GET_AWS_REGION }}
      GET_AWS_ENDPOINT_URL_S3: ${{ secrets.GET_AWS_ENDPOINT_URL_S3 }}
      GET_S3_BUCKET: ${{ secrets.GET_S3_BUCKET }}
      GET_UPSTASH_REDIS_REST_URL: ${{ secrets.GET_UPSTASH_REDIS_REST_URL }}
      GET_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.GET_UPSTASH_REDIS_REST_TOKEN }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
      QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Check the deploy secrets
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            GET_DATABASE_URL \
            GET_AWS_ACCESS_KEY_ID GET_AWS_SECRET_ACCESS_KEY GET_AWS_REGION \
            GET_AWS_ENDPOINT_URL_S3 GET_S3_BUCKET \
            GET_UPSTASH_REDIS_REST_URL GET_UPSTASH_REDIS_REST_TOKEN \
            QSTASH_CURRENT_SIGNING_KEY QSTASH_NEXT_SIGNING_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "error: missing deploy secrets: ${missing[*]}" >&2
            echo "error: add them with 'depot ci secrets add <NAME>' in the org" >&2
            exit 1
          fi
          echo "deploy secrets present"

      - name: Install dependencies
        run: bun install --cwd "$GITHUB_WORKSPACE" --frozen-lockfile

      - name: Typecheck
        run: bun --cwd "$GITHUB_WORKSPACE" run typecheck

      - name: Test
        run: bun --cwd "$GITHUB_WORKSPACE" run test

      - name: Apply database migrations
        run: bun run scripts/migrate.ts

      - name: Deploy the worker
        run: bunx wrangler deploy --minify

      - name: Publish the worker secrets
        env:
          SECRETS_FILE: ${{ runner.temp }}/get-secrets.json
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$SECRETS_FILE"' EXIT
          bun -e '
            const pairs = [
              ["DATABASE_URL", process.env.GET_DATABASE_URL],
              ["AWS_ACCESS_KEY_ID", process.env.GET_AWS_ACCESS_KEY_ID],
              ["AWS_SECRET_ACCESS_KEY", process.env.GET_AWS_SECRET_ACCESS_KEY],
              ["AWS_REGION", process.env.GET_AWS_REGION],
              ["AWS_ENDPOINT_URL_S3", process.env.GET_AWS_ENDPOINT_URL_S3],
              ["S3_BUCKET", process.env.GET_S3_BUCKET],
              ["UPSTASH_REDIS_REST_URL", process.env.GET_UPSTASH_REDIS_REST_URL],
              ["UPSTASH_REDIS_REST_TOKEN", process.env.GET_UPSTASH_REDIS_REST_TOKEN],
              ["QSTASH_CURRENT_SIGNING_KEY", process.env.QSTASH_CURRENT_SIGNING_KEY],
              ["QSTASH_NEXT_SIGNING_KEY", process.env.QSTASH_NEXT_SIGNING_KEY],
            ]
            const body = {}
            const missing = []
            for (const [name, value] of pairs) {
              if (!value) missing.push(name)
              else body[name] = value
            }
            if (missing.length) {
              console.error("error: missing worker secrets: " + missing.join(" "))
              process.exit(1)
            }
            await Bun.write(process.env.SECRETS_FILE, JSON.stringify(body))
          '
          bunx wrangler secret bulk "$SECRETS_FILE"
